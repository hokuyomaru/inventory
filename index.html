<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北洋丸 在庫管理</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
body{font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif;background:#e8f0f7;color:#1a2a3a;min-height:100vh;-webkit-text-size-adjust:100%}
.container{max-width:740px;margin:0 auto;padding:24px 16px 80px}
.header{background:#1a4a7a;color:#fff;border-radius:12px;padding:18px 20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.header h1{font-size:18px;font-weight:700;letter-spacing:0.03em}
.header-meta{font-size:12px;color:#a8c8e8;margin-top:4px}
.header-right{text-align:right;color:#a8c8e8}
.header-total-label{font-size:11px;margin-bottom:2px}
.header-total{font-size:22px;font-weight:700;color:#fff;line-height:1.2}
.sync-status{font-size:11px;text-align:center;padding:6px;border-radius:8px;margin-bottom:12px;background:#fff;border:1px solid #c0d4e8;color:#5a7a9a}
.sync-status.ok{color:#27ae60;border-color:#80c890}
.sync-status.err{color:#c0392b;border-color:#e8a0a0}

/* TOP */
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.menu{grid-template-columns:1fr}}
.menu-card{display:block;background:#fff;border:1px solid #c0d4e8;border-radius:12px;padding:22px 20px;text-decoration:none;color:#1a2a3a;transition:background .15s,border-color .15s}
.menu-card:hover{background:#f4f8fc;border-color:#1a4a7a}
.menu-title{font-size:20px;font-weight:700;color:#1a4a7a;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.menu-arrow{font-size:18px;color:#5a7a9a}
.menu-sub{font-size:12px;color:#5a7a9a;line-height:1.8}
.menu-alert{color:#c0392b;font-weight:700}
.back-link{display:inline-block;font-size:14px;color:#1a4a7a;text-decoration:none;font-weight:700;margin-bottom:10px;padding:6px 0}

/* 追加フォーム */
.add-form,.section-add-form{background:#fff;border:1px solid #c0d4e8;border-radius:10px;padding:14px;margin-bottom:12px}
.section-add-form{margin-bottom:16px}
.add-form-title{font-size:12px;font-weight:700;color:#1a4a7a;margin-bottom:10px;letter-spacing:0.04em}
.add-form-row,.section-add-row{display:flex;gap:8px;flex-wrap:wrap}
.add-form input,.add-form select,.section-add-row input{font-size:16px;padding:0 10px;height:40px;border:1px solid #b0c8e0;border-radius:7px;background:#f4f8fc;color:#1a2a3a;font-family:inherit}
.add-form input,.section-add-row input{flex:1;min-width:150px}
.add-form select#new-section{min-width:160px}
.add-form select#new-unit{min-width:70px}
.add-form button{white-space:nowrap;font-size:14px;padding:0 16px;height:40px;border:none;border-radius:7px;background:#1a4a7a;color:#fff;cursor:pointer;font-family:inherit;font-weight:600}
.add-form button:hover{background:#0e3460}
.section-add-row button{white-space:nowrap;font-size:14px;padding:0 14px;height:40px;border:1px solid #b0c8e0;border-radius:7px;background:#fff;color:#1a4a7a;cursor:pointer;font-family:inherit;font-weight:600}
.section-add-row button:hover{background:#e8f0f7}

/* セクション */
.section-block{margin-bottom:10px;border:1px solid #c0d4e8;border-radius:10px;overflow:hidden;background:#fff}
.section-header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;cursor:pointer;background:#dceaf5;user-select:none}
.section-header:hover{background:#cde0f0}
.section-left{display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap}
.section-name{font-size:14px;font-weight:700;color:#1a4a7a}
.section-count{font-size:12px;color:#5a7a9a}
.section-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.section-chevron{font-size:13px;color:#5a7a9a;transition:transform 0.2s;display:inline-block}
.section-chevron.open{transform:rotate(180deg)}
.btn-section-delete{font-size:11px;padding:0 8px;height:24px;border:1px solid #ddd;border-radius:5px;background:#fff;color:#bbb;cursor:pointer;font-family:inherit}
.btn-section-delete:hover{background:#fdecea;color:#c0392b;border-color:#e8a0a0}
.section-body{display:none;flex-direction:column}
.section-body.open{display:flex}
.empty-section,.loading{padding:14px 16px;font-size:12px;color:#8aaabb;border-top:1px solid #e8f0f7}
.loading{background:#fff;border:1px solid #c0d4e8;border-radius:10px}

/* 品目カード */
.item-card{padding:11px 16px;border-top:1px solid #eaf2f8;background:#fff}
.item-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.item-name{font-size:13px;font-weight:600;color:#1a2a3a;flex:1;min-width:120px;line-height:1.4}
.item-stock{display:flex;align-items:center;gap:6px}
.stock-num{font-size:22px;font-weight:700;min-width:56px;text-align:center;color:#1a4a7a;white-space:nowrap}
.stock-num.zero{color:#c0392b}
.stock-num.low{color:#d35400}
.stock-unit{font-size:12px;font-weight:600;color:#5a7a9a;margin-left:2px}
.btn-stock{width:36px;height:36px;border:1px solid #b0c8e0;border-radius:7px;background:#f4f8fc;color:#1a4a7a;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;font-weight:700}
.btn-stock.minus:hover{background:#fdecea;color:#c0392b;border-color:#e8a0a0}
.btn-stock.plus:hover{background:#eaf5f0;color:#27ae60;border-color:#80c890}
.item-meta{font-size:10px;color:#8aaabb;margin-top:5px}
.item-actions{display:flex;gap:6px;margin-left:auto;align-items:center}
.btn-move{padding:0 10px;height:28px;font-size:11px;border:1px solid #b0c8e0;border-radius:6px;background:#f4f8fc;color:#1a4a7a;cursor:pointer;font-family:inherit;font-weight:600}
.btn-move:hover{background:#d0e4f2}
.btn-delete{padding:0 10px;height:28px;font-size:11px;border:1px solid #ddd;border-radius:6px;background:#fff;color:#bbb;cursor:pointer;font-family:inherit}
.btn-delete:hover{background:#fdecea;color:#c0392b;border-color:#e8a0a0}

/* メモ */
.item-memo-area{margin-top:8px}
.memo-head{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.memo-toggle{font-size:11px;color:#5a7a9a;cursor:pointer;background:none;border:none;padding:0;font-family:inherit;display:inline-flex;align-items:center;gap:3px}
.memo-toggle:hover{color:#1a4a7a}
.memo-last{font-size:10px;color:#8aaabb}
.memo-section{margin-top:8px;background:#f4f8fc;border-radius:8px;padding:10px}
.memo-fields{display:flex;gap:8px;flex-wrap:wrap}
.memo-fields input{font-size:16px;padding:0 8px;height:36px;border:1px solid #b0c8e0;border-radius:6px;background:#fff;color:#1a2a3a;font-family:inherit}
.memo-author-inp{min-width:110px;flex:1}
.memo-text-inp{min-width:160px;flex:2}
.memo-save{font-size:13px;padding:0 14px;height:36px;border:none;border-radius:6px;background:#1a4a7a;color:#fff;cursor:pointer;font-family:inherit;font-weight:600;white-space:nowrap}
.memo-save:hover{background:#0e3460}
.memo-log{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.memo-entry{font-size:11px;color:#3a5a7a;border-left:3px solid #a0c4e0;padding:2px 0 2px 8px}
.memo-entry-header{font-size:10px;color:#8aaabb;margin-bottom:2px}
.memo-entry-author{font-weight:700;color:#1a4a7a}
.memo-del-btn{margin-left:8px;font-size:10px;padding:1px 7px;height:20px;border:1px solid #ddd;border-radius:4px;background:#fff;color:#bbb;cursor:pointer;font-family:inherit;vertical-align:middle}
.memo-del-btn:hover{background:#fdecea;color:#c0392b;border-color:#e8a0a0}

/* トースト・モーダル */
.saving-toast{position:fixed;bottom:20px;right:20px;background:#1a4a7a;color:#fff;font-size:12px;padding:8px 16px;border-radius:8px;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:300}
.saving-toast.show{opacity:1}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,20,60,0.45);z-index:100;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:24px 20px;width:300px;max-width:92vw;box-shadow:0 8px 32px rgba(0,40,100,0.18)}
.modal-product{font-size:15px;font-weight:700;color:#1a2a3a;margin-bottom:3px}
.modal-dir{font-size:12px;color:#5a7a9a;margin-bottom:12px}
.modal-cur{font-size:13px;color:#5a7a9a;margin-bottom:10px}
.modal input[type=number]{width:100%;font-size:28px;font-weight:700;text-align:center;padding:8px;border:1px solid #b0c8e0;border-radius:8px;background:#f4f8fc;color:#1a4a7a;margin-bottom:10px;font-family:inherit}
.modal-preview{font-size:14px;color:#1a4a7a;text-align:center;margin-bottom:16px;min-height:18px;font-weight:700}
.modal-preview .warn{display:block;font-size:11px;color:#c0392b;font-weight:600;margin-top:4px}
.modal-btns{display:flex;gap:8px}
.modal-btns button{flex:1;height:42px;font-size:14px;border-radius:8px;border:1px solid #b0c8e0;cursor:pointer;background:#fff;color:#1a2a3a;font-family:inherit;font-weight:600}
.modal-btns .confirm{background:#1a4a7a;color:#fff;border-color:#1a4a7a}
.modal-btns .confirm:hover{background:#0e3460}
.modal-btns .cancel:hover{background:#e8f0f7}
.modal select{width:100%;font-size:16px;padding:0 10px;height:42px;border:1px solid #b0c8e0;border-radius:8px;background:#f4f8fc;color:#1a2a3a;font-family:inherit;margin-bottom:14px}
.err{border:1.5px solid #c0392b !important}
</style>
</head>
<body>
<div class="container">

  <!-- ===== TOP ===== -->
  <div id="view-top">
    <div class="header">
      <div>
        <h1>北洋丸 在庫管理</h1>
        <div class="header-meta">管理する在庫を選んでください</div>
      </div>
    </div>
    <div class="sync-status">🔄 Firebase に接続中...</div>
    <div class="menu">
      <a class="menu-card" href="#/food">
        <div class="menu-title">食品在庫<span class="menu-arrow">›</span></div>
        <div class="menu-sub" id="menu-sub-food">読み込み中...</div>
      </a>
      <a class="menu-card" href="#/gear">
        <div class="menu-title">漁具在庫<span class="menu-arrow">›</span></div>
        <div class="menu-sub" id="menu-sub-gear">読み込み中...</div>
      </a>
    </div>
  </div>

  <!-- ===== 在庫ページ（食品・漁具共通） ===== -->
  <div id="view-store" hidden>
    <a class="back-link" href="#/">‹ TOPへ戻る</a>
    <div class="header">
      <div>
        <h1 id="store-title"></h1>
        <div class="header-meta" id="sub-info"></div>
      </div>
      <div class="header-right">
        <div class="header-total-label">合計在庫</div>
        <div class="header-total" id="total-label">—</div>
      </div>
    </div>
    <div class="sync-status">🔄 Firebase に接続中...</div>

    <div class="add-form">
      <div class="add-form-title" id="add-title">▸ 商品を追加</div>
      <div class="add-form-row">
        <input type="text" id="new-product" placeholder="商品名を入力..." />
        <select id="new-section"></select>
        <select id="new-unit" hidden></select>
        <button id="btn-add-product">＋ 追加</button>
      </div>
    </div>

    <div class="section-add-form">
      <div class="add-form-title">▸ セクションを追加</div>
      <div class="section-add-row">
        <input type="text" id="new-section-name" placeholder="新しいセクション名を入力..." />
        <button id="btn-add-section">＋ 作成</button>
      </div>
    </div>

    <div id="sections-list"></div>
  </div>
</div>

<!-- 在庫変更モーダル -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-product" id="modal-title"></div>
    <div class="modal-dir" id="modal-sub"></div>
    <div class="modal-cur" id="modal-current"></div>
    <input type="number" id="modal-input" min="1" step="1" inputmode="numeric" pattern="[0-9]*" placeholder="0" />
    <div class="modal-preview" id="modal-preview"></div>
    <div class="modal-btns">
      <button class="cancel" id="modal-cancel">キャンセル</button>
      <button class="confirm" id="modal-confirm">確定</button>
    </div>
  </div>
</div>

<!-- セクション移動モーダル -->
<div class="modal-bg" id="move-modal">
  <div class="modal">
    <div class="modal-product" id="move-modal-title"></div>
    <div class="modal-dir">移動先のセクションを選んでください</div>
    <select id="move-section-select"></select>
    <div class="modal-btns">
      <button class="cancel" id="move-cancel">キャンセル</button>
      <button class="confirm" id="move-confirm">移動する</button>
    </div>
  </div>
</div>

<div class="saving-toast" id="saving-toast">保存しました ✓</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD0-Dyqn27zDbqfQ2dc94XEMm_SfUK-xQ0",
  authDomain: "hokuyomaru-inventory.firebaseapp.com",
  databaseURL: "https://hokuyomaru-inventory-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "hokuyomaru-inventory",
  storageBucket: "hokuyomaru-inventory.firebasestorage.app",
  messagingSenderId: "77316847092",
  appId: "1:77316847092:web:f4348f0681854e533cf5a1",
  measurementId: "G-SL0BHJQ56V"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ================= 初期データ ================= */
/* 食品：保存先 "inventory"（既存データ。すでに登録済みのため、ここは空のときだけ使われる） */
const FOOD_SECTIONS = ["ふるさと納税メイン商品","昆布商品","ど冷えもんメイン商品","知床桜鱗","その他","催事用"];
const FOOD_PRODUCTS = {
  "ふるさと納税メイン商品": ["訳あり秋鮭 1.3kg","来運サーモン 800g","骨取り秋鮭 1.2kg","カマ＆ハラス 1.5kg","サイコロサーモン 1kg","鍋用カットフグ 350g"],
  "昆布商品": ["知床昆布 80g","知床昆布粉末 25g","刻み昆布 50g","刻み昆布 100g","知床昆布ミルクジェラート（カップ）","知床昆布ミルクジェラート（バルク）"],
  "ど冷えもんメイン商品": ["サクラマス刺身 50g","マツカワ刺身 50g","生タコ刺身 50g","オオカミウオ刺身 50g","炙りサクラマス刺身 50g","カレイ刺身 50g","お刺身福袋","お刺身じゃない福袋"],
  "知床桜鱗": ["知床桜鱗刺身 50g","知床桜鱗（1本）","知床桜鱗〜極〜（1本）","知床桜鱗〜七分咲き〜（1本）"],
  "その他": ["パリとば 30g"],
  "催事用": []
};

/* 漁具：保存先 "gear"（初回アクセス時に一度だけ登録される） */
const GEAR_SEED = [
  { section:"ロープ類", unit:"丸", items:[
    ["マリンタフSロープ 16ミリ M打",2],
    ["マリンタフSロープ 16ミリ S打",1],
    ["マリンタフSロープ 18ミリ S打",7],
    ["マリンタフSロープ 20ミリ S打",2],
    ["マリンタフSロープ 20ミリ SM打",1],
    ["マリンタフSロープ 24ミリ S打",5],
    ["マリンタフSロープ 24ミリ M打",2],
    ["マリンタフSロープ 28ミリ S打",7],
    ["マリンタフSHT 28ミリ",1],
    ["マリンタフエイトロープ 16ミリ M打",4],
    ["マリンタフエイトロープ 18ミリ M打",5],
    ["マリンタフエイトロープ 18ミリ S打",1],
    ["ノーブレインロープ 12ミリ",11],
    ["ニューシグナルロープ 18ミリ",1]
  ]},
  { section:"鉛入りロープ", unit:"丸", items:[
    ["マリンタフSプラスロープ 22ミリ",2],
    ["マリンタフSプラスロープ 24ミリ",2],
    ["トーコーパワープラスロープ 20ミリ",2],
    ["ダンラインプラスロープ 18ミリ",1],
    ["PP岩糸 規格355",2]
  ]},
  { section:"PP岩糸", unit:"丸", items:[
    ["PP岩糸 規格150",5],
    ["PP岩糸 規格75",3],
    ["PP岩糸 規格100",1],
    ["PP岩糸 規格62",4],
    ["PP岩糸 規格50",4],
    ["PP岩糸 鉛 60g",5],
    ["PP岩糸 38g",14],
    ["PP岩糸 25g",21],
    ["PP岩糸 20g",26]
  ]},
  { section:"トワイン", unit:"丸", items:[
    ["トワイン 3.2g",15],
    ["トワイン 5g",36],
    ["トワイン 7.5g",0],
    ["トワイン 10g",34],
    ["トワイン 12.5g",16],
    ["トワイン 15g",3],
    ["トワイン 20g",10],
    ["トワイン 30g",23],
    ["トワイン 62.5g",2],
    ["トワイン 75g",3]
  ]},
  { section:"綿糸", unit:"個", items:[
    ["綿糸 12号",13],
    ["綿糸 16号",20],
    ["綿糸 20号",8],
    ["綿糸 24号",11],
    ["綿糸 32号",14],
    ["綿糸 42号",26]
  ]}
];

/* ================= ストア定義 ================= */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function newItem(name, stock, unit, stamp){
  const item = {id:uid(), name, stock:stock||0, lastChanged:stamp||null, memos:[]};
  if(unit) item.unit = unit;
  return item;
}

const STORES = {
  food: {
    path:"inventory", title:"食品在庫", itemWord:"商品", countWord:"品",
    defaultUnit:"点", units:null, showUnit:false,
    seed(){
      const sections = FOOD_SECTIONS.slice(), data = {};
      sections.forEach(s=>{ data[s] = (FOOD_PRODUCTS[s]||[]).map(n=>newItem(n,0)); });
      return {sections, data};
    }
  },
  gear: {
    path:"gear", title:"漁具在庫", itemWord:"品目", countWord:"品目",
    defaultUnit:"丸", units:["丸","個","本","枚","巻","箱","m"], showUnit:true,
    seed(){
      const now = Date.now(), sections = [], data = {};
      GEAR_SEED.forEach(g=>{
        sections.push(g.section);
        data[g.section] = g.items.map(([n,c])=>newItem(n,c,g.unit,now));
      });
      return {sections, data};
    }
  }
};

const state = {};
Object.keys(STORES).forEach(k=>{ state[k] = {loaded:false, error:null, sections:[], data:{}}; });
let current = null;            // null=TOP / "food" / "gear"
const memoOpen = {};
const sectionOpen = {};
let modalState = null;
let moveState = null;

/* ================= ユーティリティ ================= */
function fmtDate(ts){
  if(!ts) return "";
  const d = new Date(ts);
  return d.getFullYear()+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+String(d.getDate()).padStart(2,"0")+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
function eh(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function toArray(x){ if(!x) return []; return Array.isArray(x) ? x.filter(v=>v!=null) : Object.values(x).filter(v=>v!=null); }
function stockClass(n){ return n===0?" zero":n<=5?" low":""; }
function unitOf(key,p){ return p.unit || STORES[key].defaultUnit; }
function allItems(key){ const st=state[key]; return st.sections.flatMap(s=>st.data[s]||[]); }
function sumByUnit(key, items){
  const totals = {}, order = [];
  items.forEach(p=>{ const u=unitOf(key,p); if(!(u in totals)){ totals[u]=0; order.push(u); } totals[u]+=p.stock; });
  if(!order.length) return "0"+STORES[key].defaultUnit;
  return order.map(u=>totals[u]+u).join("・");
}
function normalizeItem(p){
  const item = {
    id: String(p.id),
    name: String(p.name==null?"":p.name),
    stock: Math.max(0, parseInt(p.stock,10)||0),
    lastChanged: p.lastChanged || null,
    memos: toArray(p.memos).map(m=>({ts:m.ts||0, author:String(m.author||""), text:String(m.text==null?"":m.text)}))
  };
  if(p.unit) item.unit = String(p.unit);
  return item;
}
function findItem(key,id){
  const st = state[key];
  for(const sec of st.sections){
    const arr = st.data[sec]||[];
    const idx = arr.findIndex(p=>String(p.id)===String(id));
    if(idx>=0) return {sec, idx, item:arr[idx]};
  }
  return null;
}

/* ================= 保存・同期 ================= */
function showToast(){
  const t = document.getElementById("saving-toast");
  t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1400);
}
async function persist(key, toast=true){
  const st = state[key];
  const payload = {initialized:true, sections:st.sections.slice(), data:{}};
  st.sections.forEach(s=>{ payload.data[s] = st.data[s]||[]; });
  try{
    await set(ref(db, STORES[key].path), payload);
    st.error = null;
    if(toast) showToast();
  }catch(e){
    st.error = "保存に失敗しました。通信状況を確認してください（"+e.message+"）";
  }
  updateStatus();
}

Object.keys(STORES).forEach(key=>{
  const st = state[key];
  onValue(ref(db, STORES[key].path), snap=>{
    const saved = snap.val();
    if(saved && (saved.initialized || saved.sections)){
      st.sections = toArray(saved.sections).filter(s=>typeof s==="string");
      const raw = saved.data || {};
      st.data = {};
      st.sections.forEach(s=>{ st.data[s] = toArray(raw[s]).map(normalizeItem); });
      st.loaded = true; st.error = null;
      renderAll();
    } else if(!st.loaded){
      const seeded = STORES[key].seed();
      st.sections = seeded.sections; st.data = seeded.data; st.loaded = true;
      persist(key, false);
      renderAll();
    }
  }, err=>{
    st.error = "接続エラー: "+err.message;
    updateStatus();
  });
});

function updateStatus(){
  const keys = current ? [current] : Object.keys(STORES);
  const err = keys.map(k=>state[k].error).find(Boolean);
  let text, cls = "";
  if(err){ text = "⚠️ "+err; cls = "err"; }
  else if(keys.every(k=>state[k].loaded)){ text = "✅ リアルタイム同期中 — 複数端末で共有されています"; cls = "ok"; }
  else { text = "🔄 Firebase に接続中..."; }
  document.querySelectorAll(".sync-status").forEach(el=>{ el.textContent = text; el.className = "sync-status"+(cls?" "+cls:""); });
}

/* ================= 画面切り替え ================= */
function route(){
  const h = location.hash;
  current = h==="#/food" ? "food" : h==="#/gear" ? "gear" : null;
  document.getElementById("view-top").hidden = !!current;
  document.getElementById("view-store").hidden = !current;
  closeModal(); closeMoveModal();
  if(current) setupStoreView();
  document.title = current ? STORES[current].title+"｜北洋丸 在庫管理" : "北洋丸 在庫管理";
  renderAll();
  window.scrollTo(0,0);
}

function setupStoreView(){
  const cfg = STORES[current];
  document.getElementById("store-title").textContent = cfg.title;
  document.getElementById("add-title").textContent = "▸ "+cfg.itemWord+"を追加";
  const np = document.getElementById("new-product");
  np.placeholder = cfg.itemWord+"名を入力..."; np.value = "";
  document.getElementById("new-section-name").value = "";
  const unitSel = document.getElementById("new-unit");
  if(cfg.units){
    unitSel.hidden = false;
    unitSel.innerHTML = cfg.units.map(u=>`<option value="${eh(u)}">${eh(u)}</option>`).join("");
  } else {
    unitSel.hidden = true; unitSel.innerHTML = "";
  }
  document.getElementById("new-section").innerHTML = "";
}

function buildSectionSelect(key, prefer){
  const sel = document.getElementById("new-section");
  const keep = prefer || sel.value;
  const secs = state[key].sections;
  sel.innerHTML = secs.map(s=>`<option value="${eh(s)}">${eh(s)}</option>`).join("");
  if(keep && secs.includes(keep)) sel.value = keep;
}

/* ================= 描画 ================= */
function renderAll(){
  updateStatus();
  renderTop();
  if(current) renderStore();
}

function renderTop(){
  Object.keys(STORES).forEach(key=>{
    const el = document.getElementById("menu-sub-"+key);
    if(!el) return;
    const st = state[key], cfg = STORES[key];
    if(!st.loaded){ el.textContent = "読み込み中..."; return; }
    const items = allItems(key);
    const zero = items.filter(p=>p.stock===0).length;
    const last = items.reduce((m,p)=>Math.max(m, p.lastChanged||0), 0);
    el.innerHTML = `${items.length}${cfg.countWord} ・ 合計 ${eh(sumByUnit(key, items))}<br>最終更新：${last?fmtDate(last):"—"}`
      + (zero ? `<br><span class="menu-alert">在庫ゼロ：${zero}${cfg.countWord}</span>` : "");
  });
}

function captureInputs(){
  const list = document.getElementById("sections-list");
  const vals = {};
  list.querySelectorAll("input[id]").forEach(el=>{ vals[el.id] = el.value; });
  const a = document.activeElement;
  let focus = null;
  if(a && a.id && list.contains(a)){
    focus = {id:a.id};
    try{ focus.s = a.selectionStart; focus.e = a.selectionEnd; }catch(e){}
  }
  return {vals, focus};
}
function restoreInputs(k){
  Object.keys(k.vals).forEach(id=>{ const el = document.getElementById(id); if(el) el.value = k.vals[id]; });
  if(k.focus){
    const el = document.getElementById(k.focus.id);
    if(el){
      el.focus({preventScroll:true});
      try{ if(k.focus.s!=null) el.setSelectionRange(k.focus.s, k.focus.e); }catch(e){}
    }
  }
}

function renderStore(){
  const key = current, cfg = STORES[key], st = state[key];
  const list = document.getElementById("sections-list");
  if(!st.loaded){
    list.innerHTML = `<div class="loading">読み込み中...</div>`;
    document.getElementById("total-label").textContent = "—";
    document.getElementById("sub-info").textContent = "";
    return;
  }
  buildSectionSelect(key);
  const kept = captureInputs();
  const items = allItems(key);
  document.getElementById("total-label").textContent = sumByUnit(key, items);
  document.getElementById("sub-info").textContent = st.sections.length+"セクション ・ "+items.length+cfg.countWord;

  let html = "";
  st.sections.forEach(sec=>{
    const products = st.data[sec]||[];
    const isOpen = !!sectionOpen[key+"::"+sec];
    html += `<div class="section-block">
      <div class="section-header" data-action="toggle-section" data-sec="${eh(sec)}">
        <div class="section-left">
          <span class="section-name">${eh(sec)}</span>
          <span class="section-count">${products.length}${cfg.countWord} ・ 在庫${eh(sumByUnit(key, products))}</span>
        </div>
        <div class="section-right">
          <button class="btn-section-delete" data-action="delete-section" data-sec="${eh(sec)}">削除</button>
          <span class="section-chevron${isOpen?" open":""}">▼</span>
        </div>
      </div>
      <div class="section-body${isOpen?" open":""}">`;
    if(!products.length) html += `<div class="empty-section">${cfg.itemWord}がありません。上の入力欄から追加できます。</div>`;
    products.forEach(p=>{ html += itemHtml(key, p); });
    html += `</div></div>`;
  });
  list.innerHTML = html;
  restoreInputs(kept);
}

function itemHtml(key, p){
  const cfg = STORES[key];
  const id = eh(p.id);
  const memos = p.memos||[];
  const isOpenMemo = !!memoOpen[p.id];
  const unitHtml = cfg.showUnit ? `<span class="stock-unit">${eh(unitOf(key,p))}</span>` : "";
  let memoInline = "", memoBlock = "";
  if(isOpenMemo){
    const log = memos.length
      ? `<div class="memo-log">` + memos.slice().reverse().map(m=>
          `<div class="memo-entry"><div class="memo-entry-header"><span class="memo-entry-author">${eh(m.author)}</span>　${fmtDate(m.ts)}<button class="memo-del-btn" data-action="delete-memo" data-id="${id}" data-ts="${eh(m.ts)}">削除</button></div>${eh(m.text)}</div>`
        ).join("") + `</div>`
      : "";
    memoBlock = `<div class="memo-section">
      <div class="memo-fields">
        <input class="memo-author-inp" type="text" id="ma-${id}" placeholder="担当者名（必須）" />
        <input class="memo-text-inp" type="text" id="mt-${id}" placeholder="メモ内容" />
        <button class="memo-save" data-action="save-memo" data-id="${id}">保存</button>
      </div>${log}</div>`;
  } else if(memos.length){
    const last = memos[memos.length-1];
    memoInline = `<span class="memo-last">（最終: ${eh(last.author)} ${fmtDate(last.ts)}）</span>`;
  }
  return `<div class="item-card">
    <div class="item-top">
      <div class="item-name">${eh(p.name)}</div>
      <div class="item-stock">
        <button class="btn-stock minus" data-action="minus" data-id="${id}" aria-label="減らす">−</button>
        <div class="stock-num${stockClass(p.stock)}">${p.stock}${unitHtml}</div>
        <button class="btn-stock plus" data-action="plus" data-id="${id}" aria-label="増やす">＋</button>
      </div>
      <div class="item-actions">
        <button class="btn-move" data-action="move" data-id="${id}">移動</button>
        <button class="btn-delete" data-action="delete" data-id="${id}">削除</button>
      </div>
    </div>
    <div class="item-meta">在庫更新: ${p.lastChanged?fmtDate(p.lastChanged):"未更新"}</div>
    <div class="item-memo-area">
      <div class="memo-head"><button class="memo-toggle" data-action="toggle-memo" data-id="${id}">📝 ${isOpenMemo?"メモを閉じる":"メモ"+(memos.length?" ("+memos.length+"件)":"を追加")}</button>${memoInline}</div>
      ${memoBlock}
    </div>
  </div>`;
}

/* ================= 操作 ================= */
document.getElementById("sections-list").addEventListener("click", e=>{
  const el = e.target.closest("[data-action]");
  if(!el || !current) return;
  const a = el.dataset.action;
  if(a==="toggle-section") toggleSection(el.dataset.sec);
  else if(a==="delete-section") deleteSection(el.dataset.sec);
  else if(a==="plus" || a==="minus") openModal(el.dataset.id, a);
  else if(a==="move") openMoveModal(el.dataset.id);
  else if(a==="delete") deleteProduct(el.dataset.id);
  else if(a==="toggle-memo"){ memoOpen[el.dataset.id] = !memoOpen[el.dataset.id]; renderStore(); }
  else if(a==="save-memo") saveMemo(el.dataset.id);
  else if(a==="delete-memo") deleteMemo(el.dataset.id, el.dataset.ts);
});

function toggleSection(sec){
  const k = current+"::"+sec;
  sectionOpen[k] = !sectionOpen[k];
  renderStore();
}

function addSection(){
  const key = current; if(!key) return;
  const st = state[key];
  const inp = document.getElementById("new-section-name");
  const name = inp.value.trim();
  if(!name) return;
  if(/[.#$\[\]\/]/.test(name)){ alert("セクション名に「. # $ [ ] /」は使えません"); return; }
  if(st.sections.includes(name)){ alert("同名のセクションが既にあります"); return; }
  st.sections.push(name);
  st.data[name] = [];
  inp.value = "";
  sectionOpen[key+"::"+name] = true;
  buildSectionSelect(key, name);
  persist(key); renderAll();
}

function deleteSection(sec){
  const key = current, st = state[key];
  const products = st.data[sec]||[];
  const msg = products.length
    ? `「${sec}」には${products.length}${STORES[key].countWord}入っています。\nセクションごとすべて削除しますか？`
    : `「${sec}」を削除しますか？`;
  if(!confirm(msg)) return;
  st.sections = st.sections.filter(s=>s!==sec);
  delete st.data[sec];
  persist(key); renderAll();
}

function addProduct(){
  const key = current; if(!key) return;
  const cfg = STORES[key], st = state[key];
  const inp = document.getElementById("new-product");
  const name = inp.value.trim();
  const sec = document.getElementById("new-section").value;
  if(!name) return;
  if(!sec || !st.sections.includes(sec)){ alert("先にセクションを作成してください"); return; }
  const unit = cfg.units ? document.getElementById("new-unit").value : null;
  if(!st.data[sec]) st.data[sec] = [];
  st.data[sec].push(newItem(name, 0, unit));
  inp.value = "";
  sectionOpen[key+"::"+sec] = true;
  persist(key); renderAll();
}

function deleteProduct(id){
  const key = current, f = findItem(key, id);
  if(!f) return;
  if(!confirm("「"+f.item.name+"」を削除しますか？")) return;
  state[key].data[f.sec].splice(f.idx,1);
  persist(key); renderAll();
}

/* 在庫の増減 */
function openModal(id, dir){
  const key = current, f = findItem(key, id);
  if(!f) return;
  modalState = {key, id, dir};
  const u = unitOf(key, f.item);
  document.getElementById("modal-title").textContent = f.item.name;
  document.getElementById("modal-sub").textContent = dir==="plus" ? "増やす数を入力してください" : "減らす数を入力してください";
  document.getElementById("modal-current").textContent = "現在の在庫: "+f.item.stock+u;
  const inp = document.getElementById("modal-input");
  inp.value = ""; inp.classList.remove("err");
  document.getElementById("modal-preview").innerHTML = "";
  document.getElementById("modal").classList.add("open");
  setTimeout(()=>inp.focus(), 60);
}
function updatePreview(){
  if(!modalState) return;
  const {key,id,dir} = modalState;
  const f = findItem(key, id);
  const prev = document.getElementById("modal-preview");
  if(!f){ prev.innerHTML = ""; return; }
  const u = unitOf(key, f.item);
  const v = parseInt(document.getElementById("modal-input").value, 10);
  if(isNaN(v) || v<=0){ prev.innerHTML = ""; return; }
  const next = dir==="plus" ? f.item.stock+v : Math.max(0, f.item.stock-v);
  let html = `${f.item.stock} → ${next}${eh(u)}`;
  if(dir==="minus" && v>f.item.stock) html += `<span class="warn">※現在の在庫数を超えているため0になります</span>`;
  prev.innerHTML = html;
}
function confirmModal(){
  if(!modalState) return;
  const {key,id,dir} = modalState;
  const inp = document.getElementById("modal-input");
  const v = parseInt(inp.value, 10);
  if(isNaN(v) || v<=0){ inp.classList.add("err"); inp.focus(); return; }
  const f = findItem(key, id);
  if(!f){ closeModal(); return; }
  f.item.stock = dir==="plus" ? f.item.stock+v : Math.max(0, f.item.stock-v);
  f.item.lastChanged = Date.now();
  closeModal();
  persist(key); renderAll();
}
function closeModal(){ document.getElementById("modal").classList.remove("open"); modalState = null; }

/* セクション移動 */
function openMoveModal(id){
  const key = current, f = findItem(key, id);
  if(!f) return;
  const others = state[key].sections.filter(s=>s!==f.sec);
  if(!others.length){ alert("移動先のセクションがありません"); return; }
  moveState = {key, id};
  document.getElementById("move-modal-title").textContent = "「"+f.item.name+"」を移動";
  document.getElementById("move-section-select").innerHTML = others.map(s=>`<option value="${eh(s)}">${eh(s)}</option>`).join("");
  document.getElementById("move-modal").classList.add("open");
}
function confirmMove(){
  if(!moveState) return;
  const {key,id} = moveState;
  const dest = document.getElementById("move-section-select").value;
  const f = findItem(key, id);
  if(!f || !dest){ closeMoveModal(); return; }
  const st = state[key];
  const item = st.data[f.sec].splice(f.idx,1)[0];
  if(!st.data[dest]) st.data[dest] = [];
  st.data[dest].push(item);
  sectionOpen[key+"::"+dest] = true;
  closeMoveModal();
  persist(key); renderAll();
}
function closeMoveModal(){ document.getElementById("move-modal").classList.remove("open"); moveState = null; }

/* メモ */
function saveMemo(id){
  const key = current, f = findItem(key, id);
  if(!f) return;
  const aEl = document.getElementById("ma-"+id);
  const tEl = document.getElementById("mt-"+id);
  if(!aEl || !tEl) return;
  const author = aEl.value.trim(), text = tEl.value.trim();
  if(!author){ aEl.classList.add("err"); aEl.focus(); return; }
  aEl.classList.remove("err");
  if(!text){ tEl.focus(); return; }
  f.item.memos.push({ts:Date.now(), author, text});
  tEl.value = "";
  persist(key); renderAll();
}
function deleteMemo(id, ts){
  const key = current, f = findItem(key, id);
  if(!f) return;
  if(!confirm("このメモを削除しますか？")) return;
  const idx = f.item.memos.findIndex(m=>String(m.ts)===String(ts));
  if(idx<0) return;
  f.item.memos.splice(idx,1);
  persist(key); renderAll();
}

/* ================= イベント登録 ================= */
document.getElementById("btn-add-product").addEventListener("click", addProduct);
document.getElementById("btn-add-section").addEventListener("click", addSection);
document.getElementById("modal-input").addEventListener("input", updatePreview);
document.getElementById("modal-cancel").addEventListener("click", closeModal);
document.getElementById("modal-confirm").addEventListener("click", confirmModal);
document.getElementById("move-cancel").addEventListener("click", closeMoveModal);
document.getElementById("move-confirm").addEventListener("click", confirmMove);
document.getElementById("modal").addEventListener("click", e=>{ if(e.target.id==="modal") closeModal(); });
document.getElementById("move-modal").addEventListener("click", e=>{ if(e.target.id==="move-modal") closeMoveModal(); });

document.addEventListener("keydown", e=>{
  if(e.isComposing || e.keyCode===229) return;
  if(e.key==="Escape"){ closeModal(); closeMoveModal(); }
  if(e.key==="Enter" && modalState){ e.preventDefault(); confirmModal(); }
});
document.getElementById("new-product").addEventListener("keydown", e=>{
  if(e.isComposing || e.keyCode===229) return;
  if(e.key==="Enter") addProduct();
});
document.getElementById("new-section-name").addEventListener("keydown", e=>{ if(e.key==="Enter") e.preventDefault(); });

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
